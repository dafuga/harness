<!doctype html>
<!--
	Sign in with Google: the first screen of the desktop app, the phone app and the web Hub.
	Not app code: a static design that render.mjs captures. Query: ?state=default|waiting|error.
	Authentication itself is tracker item w1yjzn; this page fixes only the screen's design.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Harness · Sign in</title>
		<link rel="stylesheet" href="../../../../packages/reports/src/lib/styles/app-tokens.css" />
		<link rel="stylesheet" href="sign-in.css" />
	</head>
	<body>
		<main class="gate" aria-labelledby="title">
			<svg class="mark" viewBox="0 0 3 3" width="40" height="40" aria-hidden="true">
				<rect x="0" y="0" width="1" height="1" />
				<rect x="2" y="0" width="1" height="1" />
				<rect x="1" y="1" width="1" height="1" />
				<rect x="0" y="2" width="1" height="1" />
				<rect x="2" y="2" width="1" height="1" />
			</svg>
			<h1 id="title">Harness</h1>
			<p class="tagline">Understand your project. Design what comes next.</p>
			<button class="primary" type="button" id="sign-in">
				<svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
					<circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="2" />
					<path d="M9 9h7" stroke="currentColor" stroke-width="2" />
				</svg>
				<span>Sign in with Google</span>
			</button>
			<p class="note" id="note">
				Opens Google in your browser. Use the same account on your phone and computer.
			</p>
			<button class="quiet" type="button" id="cancel" hidden>Cancel</button>
			<p class="error" role="alert" id="error" hidden>Sign-in did not finish. Try again.</p>
		</main>
		<script>
			const state = new URLSearchParams(location.search).get('state') ?? 'default';
			const button = document.getElementById('sign-in');
			if (state === 'waiting') {
				button.disabled = true;
				button.querySelector('span').textContent = 'Waiting for Google…';
				document.getElementById('note').textContent = 'Finish signing in in your browser.';
				document.getElementById('cancel').hidden = false;
			}
			if (state === 'error') document.getElementById('error').hidden = false;
		</script>
	</body>
</html>
