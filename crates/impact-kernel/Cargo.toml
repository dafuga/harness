[package]
name = "impact-kernel"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reverse transitive impact over base and head dependency graphs."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "impact-kernel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
