name: Harness evidence

# Publishes the record that "Harness verify" produced. Only trusted code runs here: the
# default branch is checked out, and the verified commit is never checked out, installed, built
# or executed. The record is data. It is accepted only if its schema, seal, files and source
# commit all check out, and it is published by an ordinary push that never forces.
on:
  workflow_run:
    workflows: [Harness verify]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: harness-evidence
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish the record
    # Records of commits from other repositories are not published.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Install the pinned Bun
        run: npm install --global bun@1.2.18
      - name: Install the trusted checkout's dependencies exactly as locked
        run: bun install --frozen-lockfile
      - name: Fetch the verified commit as data
        run: git fetch --no-tags origin "$COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: harness-record
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate the record against the commit and attach it
        run: |
          bun run dev -- history fetch origin
          mkdir -p ".cache/harness/verifications/$COMMIT"
          cp -R incoming/. ".cache/harness/verifications/$COMMIT/"
          record=$(find ".cache/harness/verifications/$COMMIT" -name record.json | sort | tail -n 1)
          bun run dev -- history attach --commit "$COMMIT" --record "$record"
      - name: Publish evidence, notes and archived source without forcing
        run: bun run dev -- history sync origin
