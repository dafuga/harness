name: Harness verify

# Runs the code under test. This workflow can read the repository and nothing else: it has no
# write permission and uses no secrets, so a pull request cannot publish or change anything.
# The record it produces is uploaded as plain data; harness-evidence.yml publishes it from
# trusted code. Pushes of evidence, notes and archived source never start this workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Run the complete check for the combined release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: harness-verify-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.release == true && 'release' || 'focused' }}
  cancel-in-progress: true

env:
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  HARNESS_DEBT_RATCHET_BASE: ${{ github.event.before || '' }}

jobs:
  focused:
    name: Relevant checks
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read archived source commits
        run: git fetch --no-tags origin '+refs/harness/source/*:refs/harness/source/*'
      - name: Install the pinned Bun
        run: npm install --global bun@1.2.18
      - name: Install dependencies exactly as locked
        run: bun install --frozen-lockfile
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install browser and Linux display dependencies
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          sudo apt-get install --yes git-lfs xauth libgtk-3-0t64 ffmpeg
      - name: Run selected checks
        run: |
          BASE="${BASE:-$(git rev-parse HEAD^)}"
          xvfb-run -a bun run check --commit "$COMMIT" --ci-base "$BASE" --json > shared-check-result.json
      - name: Keep the exact-tree check receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shared-check-result
          path: shared-check-result.json
          if-no-files-found: ignore

  check-part:
    name: Full check part (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    # The check runs the CLI, package and browser suites. As one job it took 87 to 117 minutes
    # and was cancelled at its 120 minute limit, so its parts now run side by side. The parts
    # are defined in scripts/run-checks.ts; `bun run check` still runs all of them in order.
    strategy:
      fail-fast: false
      matrix:
        part: [static-unit, e2e-1, e2e-2, package, desktop, apps]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read archived source commits
        run: git fetch --no-tags origin '+refs/harness/source/*:refs/harness/source/*'
      - name: Install the pinned Bun
        run: npm install --global bun@1.2.18
      - name: Cache Bun dependencies
        id: cache-bun
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Cache Rust dependencies and build output
        id: cache-rust
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-
      - name: Install the pinned Rust toolchain and its Wasm target from rust-toolchain.toml
        run: rustup show
      - name: Keep generated project subprocesses on the installed Rust toolchain
        run: echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Install dependencies exactly as locked
        run: bun install --frozen-lockfile
      - name: Install the locked browser and Linux display dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Install native display, Git LFS and video dependencies
        run: sudo apt-get install --yes git-lfs xauth libgtk-3-0t64 ffmpeg
      - name: Format, types, lint, Rust native and Wasm, tests, build, package and audits
        run: xvfb-run -a bun run check --part "${{ matrix.part }}"

      - name: Save bun cache after a completed attempt
        if: ${{ !cancelled() && steps.cache-bun.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.cache-bun.outputs.cache-primary-key }}
      - name: Save rust cache after a completed attempt
        if: ${{ !cancelled() && steps.cache-rust.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ steps.cache-rust.outputs.cache-primary-key }}
      - name: Save playwright cache after a completed attempt
        if: ${{ !cancelled() && steps.cache-playwright.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-playwright.outputs.cache-primary-key }}

  check:
    name: Full check
    needs: check-part
    # Runs when a part fails or times out, so this one result stands for all of them. Not in a
    # cancelled run: the push and pull request runs of one commit cancel each other.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every part of the full check to pass
        run: test '${{ needs.check-part.result }}' = success

  verify:
    name: Verify the exact commit
    # Native evidence comes from Swift, the iOS SDK and a simulator, which exist only on macOS.
    # The full check above stays on Linux; this job runs on Apple silicon.
    runs-on: macos-15
    # Time for the run to end and leave its record: where an uncertain reference widens the
    # impact, every test and scenario is run, one command each, and that took more than an hour.
    # It allows time only; it is no budget and it approves nothing.
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the pinned Xcode and log what runs
        # The image carries several Xcodes and defaults to another. The job fails when the
        # pinned one is absent. Tools that ask xcode-select and tools that read DEVELOPER_DIR
        # must get the same answer, so the runner's selection is set to it as well.
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          test "$(xcode-select -p)" = "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -version | grep -Fx "Xcode 26.3"
          xcodebuild -showsdks
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
      - name: Install the pinned Bun
        run: npm install --global bun@1.2.18
      - name: Cache Bun dependencies
        id: cache-bun
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Cache Rust dependencies and build output
        id: cache-rust
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-
      - name: Install the pinned Rust toolchain and its Wasm target from rust-toolchain.toml
        run: rustup show
      - name: Keep generated project subprocesses on the installed Rust toolchain
        run: echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Install dependencies exactly as locked
        run: bun install --frozen-lockfile
      - name: Install the locked browser
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Install Git LFS and video dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install git-lfs ffmpeg
          git lfs install --local
      - name: Read existing notes, evidence and media
        # Read-only. Without them nothing is proven, and the whole revision is verified.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "$header"
          bun run dev -- history fetch origin || echo "::warning::Existing evidence could not be read."
          git config --local --unset-all http.https://github.com/.extraheader
      - name: Verify in a clean snapshot of the commit
        # Performance budgets are judged only against a baseline reviewed for this machine
        # profile. A runner without one fails that gate; it never borrows another profile's
        # baseline and nothing here establishes or approves one.
        id: verify
        continue-on-error: true
        run: bun run dev -- verify run --commit "$COMMIT"
      - name: Keep the record and its evidence, pass or fail
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-record
          path: .cache/harness/verifications/${{ env.COMMIT }}
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Save bun cache after a completed attempt
        if: ${{ !cancelled() && steps.cache-bun.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.cache-bun.outputs.cache-primary-key }}
      - name: Save rust cache after a completed attempt
        if: ${{ !cancelled() && steps.cache-rust.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ steps.cache-rust.outputs.cache-primary-key }}
      - name: Save playwright cache after a completed attempt
        if: ${{ !cancelled() && steps.cache-playwright.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ steps.cache-playwright.outputs.cache-primary-key }}
      - name: Fail when the verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
