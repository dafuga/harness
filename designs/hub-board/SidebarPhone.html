}

	--hx-color-warning-soft: #f3ad4124;
	--hx-color-warning-line: #f3ad4166;
	--hx-color-error-soft: #f2545b24;
	--hx-color-error-line: #f2545b66;
	--hx-color-removed: #5d2e39;
	--hx-color-info-soft: #73b7ff24;
	--hx-color-info-line: #73b7ff66;
	--hx-color-indirect: #315172;
	--hx-color-scrim: #0d1a26cc;
	--hx-color-scrim-strong: #0d1a26eb;

}
:root {
	--hx-font-family-body:
		Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
	--hx-font-family-code: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}

/* Reset and the small shared pieces: marks, pills, tags, buttons, chips, avatars, meters. */
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
}
body {
	position: relative;
	overflow: hidden;
	background: var(--hx-color-background);
	color: var(--hx-color-text);
	font: 14px/1.5 var(--hx-font-family-body);
	-webkit-font-smoothing: antialiased;
}
button {
	border: 0;
	background: transparent;
	color: inherit;
	font: inherit;
	text-align: left;
	cursor: pointer;
}
ul,
ol {
	list-style: none;
}
.muted {
	color: var(--hx-color-text-muted);
}
.num {
	font-variant-numeric: tabular-nums;
}
.clip1 {
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.clip2 {
	display: -webkit-box;
	overflow: hidden;
	-webkit-box-orient: vertical;
	-webkit-line-clamp: 2;
}
.grow {
	flex: 1;
	min-width: 0;
}
.kicker {
	color: var(--hx-color-text-muted);
	font-size: 11px;
	line-height: 16px;
	font-weight: 600;
	letter-spacing: 0.08em;
	text-transform: uppercase;
}

/* State mark: the shape repeats the state, so colour is never the only cue. */
.mk {
	display: inline-block;
	flex: none;
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: currentColor;
}
.mk[data-k='needs'] {
	border-radius: 2px;
	transform: rotate(45deg);
}
.mk[data-k='blocked'] {
	border-radius: 1px;
}
.mk[data-k='todo'] {
	border: 1.5px dashed currentColor;
	background: transparent;
}
.mk[data-k='done'] {
	width: 9px;
	height: 5px;
	border: solid currentColor;
	border-width: 0 0 2px 2px;
	border-radius: 0;
	background: transparent;
	transform: translateY(-1px) rotate(-45deg);
}
[data-tone='needs'] {
	--tone: var(--hx-color-accent);
	--tone-wash: var(--hx-color-primary-soft);
}
[data-tone='active'] {
	--tone: var(--hx-color-info);
	--tone-wash: var(--hx-color-info-soft);
}
[data-tone='blocked'] {
	--tone: var(--hx-color-error);
	--tone-wash: var(--hx-color-error-soft);
}
[data-tone='done'] {
	--tone: var(--hx-color-success);
	--tone-wash: var(--hx-color-success-soft);
}
[data-tone='warn'] {
	--tone: var(--hx-color-warning);
	--tone-wash: var(--hx-color-warning-soft);
}
[data-tone='quiet'] {
	--tone: var(--hx-color-text-muted);
	--tone-wash: transparent;
}
.tone {
	color: var(--tone);
}

.pill {
	display: inline-flex;
	align-items: center;
	flex: none;
	gap: 6px;
	height: 22px;
	padding: 0 8px;
	border: 1px solid var(--tone);
	border-radius: 999px;
	background: var(--tone-wash);
	color: var(--tone);
	font-size: 12px;
	font-weight: 600;
	white-space: nowrap;
}
.tag {
	display: inline-flex;
	align-items: center;
	flex: none;
	gap: 6px;
	height: 22px;
	padding: 0 8px;
	border-radius: 6px;
	background: var(--hx-color-surface-raised);
	color: var(--hx-color-text-supporting);
	font-size: 12px;
	white-space: nowrap;
}
.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	flex: none;
	gap: 8px;
	min-height: 36px;
	padding: 0 14px;
	border: 1px solid var(--hx-color-border-strong);
	border-radius: 6px;
	background: var(--hx-color-surface);
	font-size: 14px;
	font-weight: 500;
	white-space: nowrap;
}
.btn.primary {
	border-color: var(--hx-color-primary);
	background: var(--hx-color-primary);
	color: var(--hx-color-primary-contrast);
	font-weight: 600;
}
.btn.sm {
	min-height: 28px;
	padding: 0 10px;
	font-size: 13px;
}
.btn.wide {
	width: 100%;
}
.chip {
	display: inline-flex;
	align-items: center;
	flex: none;
	gap: 8px;
	min-height: 32px;
	padding: 0 12px;
	border: 1px solid var(--hx-color-border-strong);
	border-radius: 999px;
	font-size: 13px;
	white-space: nowrap;
}
.chip[aria-pressed='true'] {
	border-color: var(--hx-color-primary);
	background: var(--hx-color-primary-soft);
	font-weight: 600;
}
.chip .num {
	color: var(--hx-color-text-muted);
	font-weight: 500;
}
.av {
	display: grid;
	flex: none;
	place-items: center;
	width: 32px;
	height: 32px;
	border: 2px solid var(--hx-color-border-strong);
	border-radius: 50%;
	background: var(--hx-color-surface-raised);
	font-size: 11px;
	font-weight: 600;
}
.av[data-tone] {
	border-color: var(--tone);
}
.meter {
	height: 6px;
	overflow: hidden;
	border-radius: 3px;
	background: var(--hx-color-surface-raised);
}
.meter i {
	display: block;
	height: 100%;
	border-radius: 3px;
	background: var(--tone, var(--hx-color-info));
}

/* Top bar, page frame, stats strip and the filter row above the board. */
.topbar {
	display: flex;
	align-items: center;
	gap: 24px;
	height: 56px;
	padding: 0 32px;
	border-bottom: 1px solid var(--hx-color-border);
	background: var(--hx-color-surface);
}
.brand {
	display: flex;
	align-items: center;
	gap: 10px;
	font-size: 16px;
	font-weight: 600;
	letter-spacing: -0.01em;
}
.brand svg {
	color: var(--hx-color-accent);
}
.nav {
	display: flex;
	flex: 1;
	gap: 4px;
}
.nav span {
	padding: 6px 12px;
	border-radius: 6px;
	color: var(--hx-color-text-muted);
	font-weight: 500;
}
.nav span[aria-current] {
	background: var(--hx-color-selected);
	color: var(--hx-color-text);
}
.account {
	display: flex;
	align-items: center;
	gap: 10px;
	margin-left: auto;
	font-weight: 500;
}
.page {
	display: flex;
	flex-direction: column;
	gap: 16px;
	height: calc(100vh - 56px);
	padding: 16px 32px 76px;
}

.stats {
	display: grid;
	flex: none;
	grid-template-columns: 188px 188px minmax(0, 1fr) 360px;
	gap: 12px;
}
.stat {
	display: flex;
	flex-direction: column;
	gap: 2px;
	min-width: 0;
	padding: 14px 16px;
	border: 1px solid var(--hx-color-border);
	border-radius: 10px;
	background: var(--hx-color-surface);
}
.stat-num {
	font-size: 30px;
	line-height: 36px;
	font-weight: 600;
	letter-spacing: -0.02em;
}
.stat-sub {
	color: var(--hx-color-text-muted);
	font-size: 13px;
	line-height: 20px;
}
.stat.needs {
	border-color: var(--hx-color-primary-line);
	background:
		linear-gradient(var(--hx-color-primary-wash), var(--hx-color-primary-wash)),
		var(--hx-color-surface);
}
.stat.needs .kicker,
.stat.needs .stat-num {
	color: var(--hx-color-accent);
}
.stat-cols {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	gap: 20px;
	margin-top: 6px;
}
.stat-cols.two {
	grid-template-columns: repeat(2, minmax(0, 1fr));
}
.unit {
	display: flex;
	flex-direction: column;
	gap: 6px;
	min-width: 0;
}
.unit-head {
	display: flex;
	align-items: center;
	gap: 8px;
	font-weight: 600;
	line-height: 20px;
}
.unit-head .state {
	margin-left: auto;
	color: var(--tone);
	font-size: 12px;
}
.unit-sub {
	color: var(--hx-color-text-muted);
	font-size: 12px;
	line-height: 16px;
}

.toolbar {
	display: flex;
	align-items: center;
	flex: none;
	gap: 8px;
}
.toolbar .spacer {
	flex: 1;
}
.search {
	display: flex;
	align-items: center;
	gap: 8px;
	width: 220px;
	height: 36px;
	padding: 0 12px;
	border: 1px solid var(--hx-color-border-strong);
	border-radius: 6px;
	background: var(--hx-color-surface);
	color: var(--hx-color-text-muted);
	font-size: 13px;
}
.statusline {
	position: absolute;
	bottom: 28px;
	left: 32px;
	display: flex;
	align-items: center;
	gap: 8px;
	color: var(--hx-color-text-muted);
	font-size: 13px;
}
.statusline .mk {
	color: var(--hx-color-success);
}

/* The board: four columns of short cards. A card never holds a form; a tap opens its detail. */
.board {
	display: grid;
	flex: 1;
	grid-template-columns: repeat(4, minmax(0, 1fr));
	gap: 12px;
	min-height: 0;
}
.col {
	display: flex;
	flex-direction: column;
	min-width: 0;
	min-height: 0;
	padding: 8px;
	border-radius: 12px;
	background: var(--hx-color-hover);
}
.col-head {
	display: flex;
	align-items: center;
	flex: none;
	gap: 8px;
	min-height: 40px;
	padding: 0 8px 8px;
	font-size: 13px;
	font-weight: 600;
}
.col-head .mk {
	color: var(--tone);
}
.col-head .count {
	color: var(--hx-color-text-muted);
	font-weight: 500;
}
.col-head .extra {
	margin-left: auto;
}
.cards {
	display: flex;
	flex: 1;
	flex-direction: column;
	gap: 8px;
	min-height: 0;
	overflow: hidden;
}
.card {
	display: flex;
	flex: none;
	flex-direction: column;
	gap: 4px;
	width: 100%;
	min-width: 0;
	padding: 10px 12px;
	border: 1px solid var(--hx-color-border);
	border-radius: 8px;
	background: var(--hx-color-surface);
}
.card-top {
	display: flex;
	align-items: center;
	gap: 8px;
	color: var(--hx-color-text-muted);
	font-size: 12px;
	line-height: 18px;
}
.card-top .project {
	flex: none;
	font-weight: 600;
	white-space: nowrap;
}
.card-top .sep {
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.card-top .sep::before {
	content: '· ';
}
.card-top .when {
	margin-left: auto;
	white-space: nowrap;
}
.card-title {
	font-size: 14px;
	line-height: 20px;
	font-weight: 500;
}
.card-foot {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 6px;
	min-height: 22px;
	font-size: 12px;
}
.card-foot .end {
	margin-left: auto;
}
.card-line {
	display: flex;
	align-items: center;
	gap: 8px;
	min-width: 0;
	color: var(--hx-color-text-supporting);
	font-size: 13px;
	line-height: 20px;
}
.card-line .mk {
	color: var(--tone);
}
.card.needs {
	border-color: var(--hx-color-primary-line);
	background:
		linear-gradient(var(--hx-color-primary-wash), var(--hx-color-primary-wash)),
		var(--hx-color-surface);
}
.card.done .card-title {
	color: var(--hx-color-text-supporting);
}
.card.selected {
	border-color: var(--hx-color-primary);
	box-shadow: 0 0 0 2px var(--hx-color-primary-tint);
}
.link {
	color: var(--hx-color-info);
	text-decoration: underline;
	text-underline-offset: 2px;
}
.col-more {
	display: flex;
	align-items: center;
	justify-content: center;
	flex: none;
	min-height: 32px;
	margin-top: 6px;
	border-radius: 6px;
	color: var(--hx-color-text-muted);
	font-size: 13px;
	font-weight: 500;
}
.col-empty {
	display: grid;
	flex: 1;
	place-items: center;
	border: 1px dashed var(--hx-color-border-strong);
	border-radius: 8px;
	color: var(--hx-color-text-muted);
	font-size: 13px;
}

/* Agents dock: a pill in the bottom-right corner of every page, and the panel it opens. */
.dock-pill {
	position: absolute;
	right: 32px;
	bottom: 16px;
	display: flex;
	align-items: center;
	gap: 12px;
	height: 48px;
	padding: 0 16px 0 10px;
	border: 1px solid var(--hx-color-border-strong);
	border-radius: 999px;
	background: var(--hx-color-surface);
	box-shadow: var(--hx-shadow-popover);
	font-weight: 600;
}
.av-stack {
	display: flex;
}
.av-stack .av {
	width: 28px;
	height: 28px;
	margin-left: 4px;
	font-size: 10px;
}
.av-stack .av:first-child {
	margin-left: 0;
}
.dock {
	position: absolute;
	right: 32px;
	bottom: 16px;
	display: flex;
	flex-direction: column;
	width: 392px;
	border: 1px solid var(--hx-color-border-strong);
	border-radius: 14px;
	background: var(--hx-color-surface);
	box-shadow: var(--hx-shadow-overlay);
}
.dock-head {
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 14px 12px 14px 16px;
	border-bottom: 1px solid var(--hx-color-border);
}
.dock-title {
	font-size: 16px;
	line-height: 22px;
	font-weight: 600;
}
.icon-btn {
	display: grid;
	flex: none;
	place-items: center;
	width: 36px;
	height: 36px;
	border-radius: 6px;
	color: var(--hx-color-text-muted);
	font-size: 20px;
	line-height: 1;
}
.dock-body {
	display: flex;
	flex-direction: column;
	gap: 16px;
	padding: 16px;
}
.dock-group {
	display: flex;
	flex-direction: column;
	gap: 8px;
}
.dock-group .kicker {
	display: flex;
	align-items: center;
	gap: 8px;
}
.dock-group[data-tone='needs'] .kicker {
	color: var(--hx-color-accent);
}
.agent {
	display: flex;
	align-items: center;
	gap: 12px;
	width: 100%;
	min-height: 52px;
	padding: 8px 10px;
	border: 1px solid transparent;
	border-radius: 8px;
}
.agent.asks {
	border-color: var(--hx-color-primary-line);
	background: var(--hx-color-primary-wash);
}
.agent-name {
	display: flex;
	align-items: baseline;
	gap: 8px;
	font-weight: 600;
	line-height: 20px;
}
.agent-name .when i {
	font-style: normal;
}
.agent-name .when {
	margin-left: auto;
	color: var(--hx-color-text-muted);
	font-size: 12px;
	font-weight: 400;
	white-space: nowrap;
}
.agent-sub {
	display: block;
	color: var(--hx-color-text-muted);
	font-size: 13px;
	line-height: 18px;
}
.agent.asks .agent-sub {
	color: var(--hx-color-text-supporting);
}
.go {
	flex: none;
	color: var(--hx-color-text-muted);
	font-size: 18px;
}
.dock-rows {
	display: flex;
	flex-direction: column;
}
.dock-rows .agent {
	border-radius: 0;
	border-width: 0 0 1px;
	border-color: var(--hx-color-border);
	padding: 8px 2px;
}
.dock-rows .agent:last-child {
	border-bottom: 0;
}
.dock-foot {
	display: flex;
	gap: 8px;
	padding: 12px 16px 16px;
	border-top: 1px solid var(--hx-color-border);
}

/* Chat inside the dock: the question, its choices in a grid, and the one composer. */
.chat {
	display: flex;
	flex: 1;
	flex-direction: column;
	gap: 12px;
	padding: 16px;
}
.bubble {
	max-width: 88%;
	padding: 10px 12px;
	border-radius: 12px 12px 12px 4px;
	background: var(--hx-color-surface-raised);
	line-height: 20px;
}
.bubble.mine {
	align-self: flex-end;
	border-radius: 12px 12px 4px 12px;
	background: var(--hx-color-info-soft);
}
.ask {
	display: flex;
	flex-direction: column;
	gap: 10px;
	padding: 12px;
	border: 1px solid var(--hx-color-primary-line);
	border-radius: 10px;
	background: var(--hx-color-primary-wash);
}
.ask-q {
	font-weight: 600;
	line-height: 20px;
}
.options {
	display: grid;
	grid-template-columns: repeat(2, minmax(0, 1fr));
	gap: 8px;
}
.option {
	display: flex;
	flex-direction: column;
	gap: 4px;
	min-height: 44px;
	padding: 10px 12px;
	border: 1px solid var(--hx-color-border-strong);
	border-radius: 8px;
	background: var(--hx-color-surface);
	font-weight: 500;
	line-height: 18px;
}
.option small {
	color: var(--hx-color-text-muted);
	font-size: 12px;
	font-weight: 400;
	line-height: 16px;
}
.badge {
	align-self: flex-start;
	padding: 0 6px;
	border-radius: 4px;
	background: var(--hx-color-primary-soft);
	color: var(--hx-color-accent);
	font-size: 11px;
	font-weight: 600;
	line-height: 18px;
}
.composer {
	display: flex;
	align-items: center;
	gap: 8px;
	margin: 0 16px 16px;
	padding: 6px 6px 6px 12px;
	border: 1px solid var(--hx-color-border-strong);
	border-radius: 10px;
	color: var(--hx-color-text-muted);
}

/* Card detail: a side panel on desktop and a sheet on iPhone. Answers and typing live here. */
.scrim {
	position: absolute;
	inset: 0;
	background: var(--hx-color-scrim);
}
.detail {
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	display: flex;
	flex-direction: column;
	gap: 20px;
	width: 520px;
	padding: 20px 24px 24px;
	border-left: 1px solid var(--hx-color-border-strong);
	background: var(--hx-color-surface);
	box-shadow: var(--hx-shadow-dialog);
}
.detail-head {
	display: flex;
	align-items: center;
	gap: 10px;
}
.detail-head .icon-btn {
	margin-left: auto;
}
.detail-title {
	font-size: 22px;
	line-height: 28px;
	font-weight: 600;
	letter-spacing: -0.02em;
}
.facts {
	display: grid;
	grid-template-columns: repeat(2, minmax(0, 1fr));
	gap: 12px 24px;
}
.fact {
	display: flex;
	flex-direction: column;
	gap: 2px;
}
.fact b {
	font-weight: 500;
}
.detail-actions {
	display: flex;
	flex-wrap: wrap;
	gap: 8px;
}
.notes {
	display: flex;
	flex-direction: column;
}
.note {
	display: flex;
	gap: 12px;
	padding: 10px 0;
	border-bottom: 1px solid var(--hx-color-border);
	line-height: 20px;
}
.note:last-child {
	border-bottom: 0;
}
.note time {
	flex: none;
	width: 44px;
	color: var(--hx-color-text-muted);
	font-size: 12px;
	font-variant-numeric: tabular-nums;
}
.section {
	display: flex;
	flex-direction: column;
	gap: 8px;
}

/* A plain list page, used to show the dock on a page other than Home. */
.list-card {
	border: 1px solid var(--hx-color-border);
	border-radius: 10px;
	background: var(--hx-color-surface);
}
.list-row {
	display: flex;
	align-items: center;
	gap: 16px;
	min-height: 56px;
	padding: 8px 20px;
	border-bottom: 1px solid var(--hx-color-border);
}
.list-row:last-child {
	border-bottom: 0;
}
.list-row .when {
	flex: none;
	width: 96px;
	color: var(--hx-color-text-muted);
	font-variant-numeric: tabular-nums;
}
.page-title {
	font-size: 26px;
	line-height: 32px;
	font-weight: 600;
	letter-spacing: -0.02em;
}

/* iPhone width: one column at a time, picked from a four-part switch; the dock is a bottom bar. */
.phone .topbar {
	height: 52px;
	padding: 0 16px;
}
.phone .page {
	gap: 12px;
	height: calc(100vh - 52px);
	padding: 12px 16px 96px;
}
.phone .btn {
	min-height: 44px;
}
.phone .btn.sm {
	min-height: 32px;
}
.pstats {
	display: flex;
	flex: none;
	flex-direction: column;
	gap: 8px;
}
.pcells {
	display: grid;
	grid-template-columns: repeat(4, minmax(0, 1fr));
	border: 1px solid var(--hx-color-border);
	border-radius: 10px;
	background: var(--hx-color-surface);
}
.pcell {
	display: flex;
	flex-direction: column;
	gap: 2px;
	min-height: 60px;
	padding: 8px 4px 8px 12px;
	border-left: 1px solid var(--hx-color-border);
}
.pcell:first-child {
	border-left: 0;
}
.pnum {
	font-size: 20px;
	line-height: 24px;
	font-weight: 600;
	letter-spacing: -0.02em;
}
.plabel {
	color: var(--hx-color-text-muted);
	font-size: 11px;
	line-height: 16px;
	white-space: nowrap;
}
.pcell.needs {
	background: var(--hx-color-primary-wash);
}
.pcell.needs .pnum,
.pcell.needs .plabel {
	color: var(--hx-color-accent);
}
.pcomputers {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	gap: 8px;
}
.pcomp {
	display: flex;
	align-items: center;
	gap: 8px;
	min-width: 0;
	min-height: 44px;
	padding: 4px 10px;
	border: 1px solid var(--hx-color-border);
	border-radius: 10px;
	background: var(--hx-color-surface);
	font-size: 12px;
	line-height: 16px;
}
.pcomp b {
	display: block;
	font-weight: 600;
}
.pchips {
	display: flex;
	align-items: center;
	flex: none;
	gap: 8px;
	min-height: 44px;
	margin-right: -16px;
	overflow: hidden;
}
.phone .chip {
	min-height: 36px;
}
.ptabs {
	display: grid;
	flex: none;
	grid-template-columns: repeat(4, minmax(0, 1fr));
	gap: 4px;
	padding: 4px;
	border-radius: 12px;
	background: var(--hx-color-hover);
}
.ptab {
	display: flex;
	align-items: center;
	flex-direction: column;
	justify-content: center;
	min-height: 48px;
	border: 1px solid transparent;
	border-radius: 8px;
	color: var(--hx-color-text-muted);
	font-size: 12px;
	line-height: 16px;
	text-align: center;
}
.ptab b {
	display: flex;
	align-items: center;
	gap: 6px;
	color: var(--hx-color-text);
	font-size: 16px;
	line-height: 20px;
	font-weight: 600;
}
.ptab b .mk {
	color: var(--hx-color-accent);
}
.ptab[aria-selected='true'] {
	border-color: var(--hx-color-border-strong);
	background: var(--hx-color-surface);
	color: var(--hx-color-text);
	font-weight: 600;
}
.phone .cards {
	flex: 1;
}
.pdock {
	position: absolute;
	right: 0;
	bottom: 0;
	left: 0;
	padding: 10px 16px 26px;
	border-top: 1px solid var(--hx-color-border);
	background: var(--hx-color-surface);
}
.dock-bar {
	display: flex;
	align-items: center;
	gap: 10px;
	width: 100%;
	height: 48px;
	padding: 0 12px 0 10px;
	border: 1px solid var(--hx-color-border-strong);
	border-radius: 999px;
	font-weight: 600;
}
.sheet {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	background: var(--hx-color-surface);
}
.sheet .dock-body {
	flex: 1;
}
.sheet .dock-foot {
	padding-bottom: 34px;
}
.sheet.pad {
	gap: 16px;
	padding: 12px 16px 24px;
}
.phone .options {
	grid-template-columns: minmax(0, 1fr);
}
.phone .detail-title {
	font-size: 20px;
	line-height: 26px;
}

/* The two alternative directions: agents in a sidebar, and one lane per project. */
.with-side {
	display: grid;
	grid-template-columns: 296px minmax(0, 1fr);
	height: calc(100vh - 56px);
}
.side {
	display: flex;
	flex-direction: column;
	gap: 16px;
	min-height: 0;
	padding: 16px;
	border-right: 1px solid var(--hx-color-border);
	background: var(--hx-color-surface);
}
.side .dock-body {
	padding: 0;
}
.side .agent .pill,
.side .when i,
.with-side .card-top .sep {
	display: none;
}
.side-foot {
	display: flex;
	flex-direction: column;
	gap: 16px;
	margin-top: auto;
	padding-top: 16px;
	border-top: 1px solid var(--hx-color-border);
}
.side-rows {
	display: flex;
	flex-direction: column;
	gap: 6px;
	margin-top: 6px;
}
.side-row {
	display: flex;
	align-items: center;
	gap: 8px;
	font-size: 13px;
	line-height: 20px;
}
.side-row .end {
	margin-left: auto;
	color: var(--hx-color-text-muted);
}
.with-side .page {
	height: auto;
	min-height: 0;
	padding: 16px 24px 24px;
}
.headline {
	font-size: 22px;
	line-height: 36px;
	font-weight: 600;
	letter-spacing: -0.02em;
}
.tabbar {
	position: absolute;
	right: 0;
	bottom: 0;
	left: 0;
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	padding: 6px 16px 26px;
	border-top: 1px solid var(--hx-color-border);
	background: var(--hx-color-surface);
}
.tabbar > span {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
	min-height: 48px;
	border-radius: 8px;
	color: var(--hx-color-text-muted);
	font-weight: 500;
}
.tabbar > span[aria-current] {
	background: var(--hx-color-selected);
	color: var(--hx-color-text);
	font-weight: 600;
}

.lanes {
	display: flex;
	flex: 1;
	flex-direction: column;
	gap: 8px;
	min-height: 0;
}
.lane-heads,
.lane {
	display: grid;
	grid-template-columns: 148px repeat(4, minmax(0, 1fr));
	gap: 12px;
	align-items: start;
}
.lane-heads {
	padding: 0 8px;
}
.lane-heads .col-head {
	min-height: 28px;
	padding: 0;
}
.lane {
	padding: 8px;
	border-radius: 12px;
	background: var(--hx-color-hover);
}
.lane-name {
	display: flex;
	align-items: flex-start;
	flex-direction: column;
	gap: 6px;
	padding: 6px 0 6px 8px;
}
.lane-name b {
	font-size: 15px;
	line-height: 20px;
	font-weight: 600;
}
.lane .cards {
	overflow: visible;
}
.mini .card-top .project,
.mini .card-top:not(:has(.when, .sep)) {
	display: none;
}
.mini .card-top .when {
	margin-left: 0;
}
.mini .card-top .sep::before {
	content: none;
}
.plane {
	display: flex;
	flex: none;
	flex-direction: column;
	gap: 8px;
}
.plane-head {
	display: flex;
	align-items: center;
	gap: 8px;
	min-height: 28px;
	font-size: 15px;
	font-weight: 600;
}
.plane-head .muted {
	font-size: 13px;
	font-weight: 400;
}
.plane-head .pill {
	margin-left: auto;
}
.plane .cards {
	flex: none;
}
.plane .col-more {
	min-height: 44px;
	margin-top: 0;
	border: 1px solid var(--hx-color-border);
}
